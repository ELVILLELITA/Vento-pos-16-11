# Configuracion del servidor
server.port=${SERVER_PORT:8081}
server.address=${SERVER_ADDRESS:127.0.0.1}

# H2 persiste los datos en ./data. Configura estas variables para usar MySQL:
# SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/vento
# SPRING_DATASOURCE_USERNAME=...
# SPRING_DATASOURCE_PASSWORD=...
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ventodb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tasa decimal: 0.13 = 13%, 0 = sin IVA.
vento.ventas.iva-tasa=${VENTO_IVA_TASA:0.13}
vento.folios.sucursal=${VENTO_SUCURSAL:S01}
vento.folios.estacion=${VENTO_ESTACION:C01}

# Correo DTE (opcional; si no se configura, la venta no falla y se registra una advertencia)
app.mail.default-consumer=${APP_MAIL_DEFAULT_CONSUMER:}
app.log.file=${APP_LOG_FILE:logs/spring.log}
